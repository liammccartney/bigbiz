<form [formGroup]="form">
  <pre>Form Control Value: {{ form.controls.qtyInput.value }}</pre>
  <input type="number" formControlName="qtyInput" />
  <hr />
  <pre>Juicy Form Control Value: {{ form.controls.qtyJuicy.value }}</pre>
  <app-j-input formControlName="qtyJuicy" />
  <hr />
  <pre>Old Juicy Form Control Value: {{ form.controls.qtyOldJuicy.value }}</pre>
  <app-old-j-input formControlName="qtyOldJuicy" />
</form>
